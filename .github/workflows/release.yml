name: Release

on:
  push:
    branches: [main]
    paths: [package.json]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: orbo-npm-release
  cancel-in-progress: false

jobs:
  publish:
    if: github.repository == 'gojhonny/orbo' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
      id-token: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: pnpm/action-setup@v4
        with:
          version: 10.32.1
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          registry-url: https://registry.npmjs.org
      - name: Install locked dependencies
        run: pnpm install --frozen-lockfile
      - name: Inspect environment
        run: ./cli/orbo doctor --ci
      - name: Identify stable release
        run: |
          node --input-type=module <<'NODE'
          import { readFileSync, appendFileSync } from 'node:fs';
          const { name, version } = JSON.parse(readFileSync('package.json', 'utf8'));
          if (name !== 'orbo-voice' || !/^[1-9]\d*\.\d+\.\d+$/.test(version)) {
            throw new Error('Expected the canonical Orbo package and a stable major version');
          }
          appendFileSync(process.env.GITHUB_ENV, `RELEASE_VERSION=${version}\nRELEASE_TAG=v${version}\nRELEASE_TARBALL=${process.env.RUNNER_TEMP}/orbo-voice-${version}.tgz\n`);
          NODE
      - name: Validate and pack once
        run: npm pack --pack-destination "$RUNNER_TEMP"
      - name: Check registry for a matching existing release
        id: registry
        run: |
          node --input-type=module <<'NODE'
          import { readFileSync, appendFileSync } from 'node:fs';
          import { createHash } from 'node:crypto';
          const integrity = `sha512-${createHash('sha512').update(readFileSync(process.env.RELEASE_TARBALL)).digest('base64')}`;
          appendFileSync(process.env.GITHUB_ENV, `RELEASE_INTEGRITY=${integrity}\n`);
          const response = await fetch(`https://registry.npmjs.org/orbo-voice/${process.env.RELEASE_VERSION}`);
          if (response.status === 404) {
            appendFileSync(process.env.GITHUB_OUTPUT, 'published=false\n');
          } else {
            if (!response.ok) throw new Error(`Registry lookup failed: ${response.status}`);
            const metadata = await response.json();
            if (metadata.dist?.integrity !== integrity) throw new Error('Published version has different contents; refusing to overwrite');
            appendFileSync(process.env.GITHUB_OUTPUT, 'published=true\n');
          }
          NODE
      - name: Publish validated tarball
        if: steps.registry.outputs.published == 'false'
        run: npm publish "$RELEASE_TARBALL" --access public --tag latest --provenance
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
      - name: Verify registry integrity and Orbo binary
        run: |
          test "$(npm view "orbo-voice@$RELEASE_VERSION" dist.integrity)" = "$RELEASE_INTEGRITY"
          cd "$RUNNER_TEMP"
          npm exec --yes --package="orbo-voice@$RELEASE_VERSION" -- orbo --help
      - name: Tag the current main commit
        run: |
          git fetch origin main --tags
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          test "$(git rev-parse origin/main)" = "$GITHUB_SHA"
          if git show-ref --verify --quiet "refs/tags/$RELEASE_TAG"; then
            test "$(git rev-list -n 1 "$RELEASE_TAG")" = "$GITHUB_SHA"
          else
            git config user.name 'Jonatas Sales'
            git config user.email 'sykes.echo@proton.me'
            git tag -a "$RELEASE_TAG" "$GITHUB_SHA" -m "Orbo $RELEASE_VERSION"
            git push origin "refs/tags/$RELEASE_TAG"
          fi
      - name: Record GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if ! gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            gh release create "$RELEASE_TAG" --verify-tag --title "Orbo $RELEASE_VERSION" --generate-notes
          fi
